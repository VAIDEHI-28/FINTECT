
services:
  postgres:
    image: postgres:16
    container_name: fintect-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: fintect
      POSTGRES_USER: fintect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintect -d fintect"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
